plugins {
    id 'com.android.application'
}

android {
    namespace 'io.bloxorz.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'io.bloxorz.mobile'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
