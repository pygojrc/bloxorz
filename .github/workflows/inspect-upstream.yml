name: Inspect upstream

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-upstream.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch bloxorz.io
        run: |
          echo '=== HEADERS ==='
          curl -sSIL -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' https://bloxorz.io/ || true
          echo '=== HTML ==='
          curl -sSL --compressed -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' https://bloxorz.io/ -o page.html
          wc -c page.html
          sed -n '1,260p' page.html
          echo '=== URL ATTRS ==='
          grep -Eoi '(src|href|data-src|action)=["'"'][^"'"']+' page.html | head -200 || true
          echo '=== IFRAME/SCRIPT/CANVAS/EMBED ==='
          grep -Ein 'iframe|script|canvas|embed|object|game|unity|ruffle|swf' page.html | head -300 || true
