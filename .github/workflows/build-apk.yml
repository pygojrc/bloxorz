name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bloxorz-mobile-v0.1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bloxorz-mobile-debug-apk
          path: bloxorz-mobile-v0.1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 &&             gh release upload v0.1.0 bloxorz-mobile-v0.1.0.apk --clobber ||             gh release create v0.1.0 bloxorz-mobile-v0.1.0.apk               --target "${{ github.sha }}"               --title "Bloxorz Mobile v0.1.0"               --notes "Android wrapper for bloxorz.io with native touch controls, local reverse proxy, and persistent WebView storage."
