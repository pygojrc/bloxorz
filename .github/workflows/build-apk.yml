name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bloxorz-mobile-v0.1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bloxorz-mobile-v0.1.1
          path: bloxorz-mobile-v0.1.1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.1 >/dev/null 2>&1 && \
            gh release upload v0.1.1 bloxorz-mobile-v0.1.1.apk --clobber || \
            gh release create v0.1.1 bloxorz-mobile-v0.1.1.apk \
              --target "${{ github.sha }}" \
              --title "Bloxorz Mobile v0.1.1" \
              --notes "Fix game loading by using the native HTTPS WebView path directly. Touch controls are now translucent; short tap sends a key, long-press for 450 ms drags the D-pad or SPACE control. Control positions persist across app restarts."
